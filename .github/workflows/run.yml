name: Stock Scanner Auto Run

on:
  schedule:
    # GitHub Actions의 지연(Delay)을 고려하여 5분씩 앞당겨 설정 (UTC 기준)
    # 00:05 (09:05 KST), 01:25 (10:25 KST), 04:25 (13:25 KST), 06:05 (15:05 KST)
    - cron: '5 0 * * 1-5'
    - cron: '25 1 * * 1-5'
    - cron: '25 4 * * 1-5'
    - cron: '5 6 * * 1-5'
  workflow_dispatch: # 문제가 생겼을 때 바로 누를 수 있는 수동 버튼

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip' # 패키지 설치 속도를 높이기 위한 캐시 추가

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run All Scanners
        env:
          # Settings > Secrets > Actions에 등록된 값 호출
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          PYTHONIOENCODING: "utf-8" # 한글 깨짐 방지
        run: |
          # 각 스크립트 실행 (에러가 나도 다음 스크립트가 돌도록 설정 가능)
          python alert.py
          python alert_value.py
