name: Stock Scanner Auto Run

on:
  schedule:
    # 한국 시간 기준 (월~금 09:10, 10:30, 13:30, 15:10)
    - cron: '10 0 * * 1-5'
    - cron: '30 1 * * 1-5'
    - cron: '30 4 * * 1-5'
    - cron: '10 6 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼 추가

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run All Scanners
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        # 여러 줄의 명령어를 실행할 때는 아래와 같이 '|'를 사용합니다.
        run: |
          python alert.py
          python alert_value.py
